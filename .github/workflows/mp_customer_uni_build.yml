name: Build WeChat customer mini program

on:
  workflow_dispatch:
  push:
    paths:
      - "clients/mp_customer_uni/**"
      - ".github/workflows/mp_customer_uni_build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_BASE: ${{ vars.MP_CUSTOMER_API_BASE || 'https://drmoto.cloud/api' }}
      VITE_USE_CLOUD_CONTAINER: 'false'
      VITE_ALLOW_DEMO_FALLBACK: 'false'
    defaults:
      run:
        working-directory: clients/mp_customer_uni
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/mp_customer_uni/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build WeChat mini program
        run: npm run build:mp-weixin

      - name: Upload mini program artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp-customer-weixin
          path: clients/mp_customer_uni/dist/build/mp-weixin
          if-no-files-found: error
